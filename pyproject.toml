# Tooling configuration only — this project runs from a checkout and is not
# packaged for PyPI. Dependency declarations live in requirements*.txt.

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".git", "data", "data_cache", "examples/demo_outputs", "training/sft_data"]

[tool.ruff.lint]
# Pyflakes + the high-signal pycodestyle rules. Formatting/line length (E501)
# is intentionally not enforced: reports and docstrings contain long Chinese
# strings that should not be re-wrapped.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files intentionally re-export a public API.
"**/__init__.py" = ["F401"]