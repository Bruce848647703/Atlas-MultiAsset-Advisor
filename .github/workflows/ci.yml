name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install "ruff>=0.6"

      - name: Ruff check
        run: ruff check .

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Tests run offline on the synthetic provider; akshare/streamlit are optional.
          pip install "numpy>=1.23" "pandas>=1.4" "scipy>=1.10" \
            "matplotlib>=3.5" "PyYAML>=5.4" "requests>=2.28" "zhconv>=1.4" \
            "pytest>=7.0" "jinja2>=3.1.2"

      - name: Run unit + integration tests
        run: python -m pytest tests/ -q --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: report.xml
          if-no-files-found: ignore

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: ATLAS_ACCESS_TOKEN=ci docker compose config -q

      - name: Build image
        run: docker build -t atlas:ci .

      - name: Refuse to start without an access token
        run: |
          if docker run --rm atlas:ci; then
            echo "::error::container started without ATLAS_ACCESS_TOKEN"
            exit 1
          fi

      - name: Smoke test health endpoint
        run: |
          docker run -d --name atlas-ci -e ATLAS_ACCESS_TOKEN=ci-token \
            -p 127.0.0.1:8501:8501 atlas:ci
          ok=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then ok=1; break; fi
            sleep 2
          done
          docker logs atlas-ci || true
          test "$ok" = "1"

      - name: Stop container
        if: always()
        run: docker rm -f atlas-ci || true

  compliance:
    name: compliance gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.23" "pandas>=1.4" "scipy>=1.10" \
            "matplotlib>=3.5" "PyYAML>=5.4" "requests>=2.28" "zhconv>=1.4" "jinja2>=3.1.2"

      - name: Suitability / disclaimer regression
        run: |
          python training/eval/eval_suite.py
          python training/eval/eval_requirement.py