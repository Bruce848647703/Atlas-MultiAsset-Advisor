name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Tests run offline on the synthetic provider; akshare/streamlit are optional.
          pip install "numpy>=1.23" "pandas>=1.4" "scipy>=1.10" \
            "matplotlib>=3.5" "PyYAML>=5.4" "requests>=2.28" \
            "pytest>=7.0" "jinja2>=3.1.2"

      - name: Run unit + integration tests
        run: python -m pytest tests/ -q --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: report.xml
          if-no-files-found: ignore

  compliance:
    name: compliance gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.23" "pandas>=1.4" "scipy>=1.10" \
            "matplotlib>=3.5" "PyYAML>=5.4" "requests>=2.28" "jinja2>=3.1.2"

      - name: Suitability / disclaimer regression
        run: |
          python training/eval/eval_suite.py
          python training/eval/eval_requirement.py