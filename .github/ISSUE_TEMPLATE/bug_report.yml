name: Bug report
description: Something in the quant core, dashboard, or data layer is wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove API keys and personal data from logs.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs. actual behaviour.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Command, inputs (capital / tier / strategy), and the smallest code or UI path that triggers it.
      placeholder: |
        python -m invest_agent.cli
        > ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Portfolio optimizer / backtest
        - Strategy selection
        - Risk profiling / suitability
        - Factor library / evolution
        - Data provider (akshare / merged)
        - Dashboard / Streamlit
        - LLM harness / tools
        - Training / evaluation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit / version
      placeholder: output of `git rev-parse --short HEAD`

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Python:
        numpy / pandas / scipy:
        Install: pip / conda

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell