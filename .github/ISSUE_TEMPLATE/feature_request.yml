name: Feature request
description: Suggest a new capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Keep it concrete. Mention affected modules (advisor / optimizer / tools / dashboard).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: The quant core can still run fully offline (no LLM)
        - label: Suitability caps and the disclaimer remain enforced
        - label: New network calls have timeouts, caching, and graceful degradation