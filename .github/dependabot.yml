version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Keep our deliberately permissive lower bounds; only bump when the
    # current constraint no longer allows the latest release.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Stay on the supported Python line (CI covers 3.10–3.13); skip the
    # bleeding-edge interpreter image until the suite is validated on it.
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]