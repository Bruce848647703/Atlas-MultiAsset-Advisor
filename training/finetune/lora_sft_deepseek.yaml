# LLaMA-Factory LoRA SFT config for the Atlas advisor.
# Base: DeepSeek-R1-Distill-Qwen-7B (served locally after fine-tuning via vLLM).
#
#   1. python training/generate_sft_data.py --n 800 --timing_ratio 0.3
#   2. llamafactory-cli train training/finetune/lora_sft_deepseek.yaml
#   3. llamafactory-cli export ... (merge) -> vLLM serve -> agent.yaml provider=local
#
### model
model_name_or_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: atlas_sft
dataset_dir: training/finetune
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: saves/atlas-lora-sft
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true

### eval (optional)
# val_size: 0.05
# per_device_eval_batch_size: 1
# evaluation_strategy: steps
# eval_steps: 200
